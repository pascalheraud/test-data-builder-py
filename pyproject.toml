[tool.poetry]
name = "test-data-builder"
version = "1.1.0"
description = "Seeds a database with rows for repository or E2E tests, using raw SQL only — Python port of ovh.heraud:test-data-builder"
authors = ["Pascal Heraud"]
readme = "README.md"
packages = [{ include = "testdatabuilder", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
testcontainers = { extras = ["postgres"], version = "^4.0" }
psycopg2-binary = "^2.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
